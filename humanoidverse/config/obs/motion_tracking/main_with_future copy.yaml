# @package _global_

# Ablation 2: Add future motion targets
# - Actor uses student-style future_motion_targets (without local_ref_key_body_pos)
# - Critic has access to future_motion_local_ref_key_body_pos through priv_obs
# Modified from 'main.yaml' for use with ppo_mimic algo
# NOTE: Requires general_tracking environment which computes future_motion observations

obs:
  history_length: 10
  future_max_steps: 95
  future_num_steps: 20
  masked_dof_vel: False
  
  obs_dict:
    # Actor obs - similar to main.yaml but adapted for ppo_mimic structure
    # History is processed separately through history_encoder (prop_history)
    actor_obs: [
      base_ang_vel,
      roll_pitch,
      dof_pos,
      dof_vel,
      actions,
      ref_motion_phase,
    ]

    # Privileged obs for critic - includes future_motion_local_ref_key_body_pos for teacher-style info
    priv_obs: [ 
      base_lin_vel,
      dif_local_rigid_body_pos,
      local_ref_rigid_body_pos,
      dr_base_com,
      dr_link_mass,
      dr_kp,
      dr_kd,
      dr_friction,
      dr_ctrl_delay,
      future_motion_local_ref_key_body_pos,
    ]

    # Future motion targets for motion_encoder (student style - without local_ref_key_body_pos)
    future_motion_targets: [
      future_motion_root_height,
      future_motion_roll_pitch,
      future_motion_base_lin_vel,
      future_motion_base_yaw_vel,
      future_motion_dof_pos,
    ]      

    # Proprioceptive history for history_encoder
    prop_history: [
      history
    ]

  obs_auxiliary:
    history:
      base_ang_vel: ${obs.history_length}
      roll_pitch: ${obs.history_length}
      dof_pos: ${obs.history_length}
      dof_vel: ${obs.history_length}
      actions: ${obs.history_length}

  obs_scales: {
    base_lin_vel: 2.0,
    base_ang_vel: 0.25,
    roll_pitch: 1.0,
    dof_pos: 1.0,
    dof_vel: 0.05,
    actions: 1.0,
    dif_local_rigid_body_pos: 1.0,
    local_ref_rigid_body_pos: 1.0,
    ref_motion_phase: 1.0,
    history: 1.0,
    dr_base_com: 1.0,
    dr_link_mass: 1.0,
    dr_kp: 1.0,
    dr_kd: 1.0,
    dr_friction: 1.0,
    dr_ctrl_delay: 1.0,
    future_motion_root_height: 1.0,
    future_motion_roll_pitch: 1.0,
    future_motion_base_lin_vel: 1.0,
    future_motion_base_yaw_vel: 1.0,
    future_motion_dof_pos: 1.0,
    future_motion_local_ref_key_body_pos: 1.0,
  }

  noise_scales: {
    base_lin_vel: 0.0,
    base_ang_vel: 0.3,
    roll_pitch: 0.2,
    dof_pos: 0.01,
    dof_vel: 0.15,
    actions: 0.0,
    dif_local_rigid_body_pos: 0.0,
    local_ref_rigid_body_pos: 0.0,
    ref_motion_phase: 0.0,
    history: 0.0,
    dr_base_com: 0.0,
    dr_link_mass: 0.0,
    dr_kp: 0.0,
    dr_kd: 0.0,
    dr_friction: 0.0,
    dr_ctrl_delay: 0.0,
    future_motion_root_height: 0.0,
    future_motion_roll_pitch: 0.0,
    future_motion_base_lin_vel: 0.0,
    future_motion_base_yaw_vel: 0.0,
    future_motion_dof_pos: 0.0,
    future_motion_local_ref_key_body_pos: 0.0,
  }

  add_noise_currculum: False
  noise_initial_value: 0.05
  noise_value_max: 1.0
  noise_value_min: 0.00001
  soft_dof_pos_curriculum_degree: 0.00001
  soft_dof_pos_curriculum_level_down_threshold: 40
  soft_dof_pos_curriculum_level_up_threshold: 42

  obs_dims:
    - base_lin_vel: 3
    - base_ang_vel: 3
    - roll_pitch: 2
    - dof_pos: ${robot.dof_obs_size}
    - dof_vel: ${robot.dof_obs_size}
    - actions: ${robot.dof_obs_size}
    - dif_local_rigid_body_pos: ${eval:'3 * ${robot.num_bodies} + 9'}
    - local_ref_rigid_body_pos: ${eval:'3 * ${robot.num_bodies} + 9'}
    - ref_motion_phase: 1
    - dr_base_com: 3
    - dr_link_mass: 22
    - dr_kp: ${robot.dof_obs_size}
    - dr_kd: ${robot.dof_obs_size}
    - dr_friction: 1
    - dr_ctrl_delay: 1
    - future_motion_root_height: 1
    - future_motion_roll_pitch: 2
    - future_motion_base_lin_vel: 3
    - future_motion_base_yaw_vel: 1
    - future_motion_dof_pos: ${robot.dof_obs_size}
    - future_motion_local_ref_key_body_pos: ${eval:'${obs.future_num_steps} * 3 * ${robot.num_key_bodies}'}

  post_compute_config: {}
  motion_len: -1
