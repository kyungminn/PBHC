# @package _global_

# Ablation: B1 + teacher-style key body observations
# - Add local_key_body_pos, local_key_body_rot, anchor_ref_pos, anchor_ref_rot, next_step_ref_motion
# - Remove ref_motion_phase (phase encoding)
# - Keep everything else same as B1 (no priv encoder, no future motion targets)

obs:
  obs_dict:
    actor_obs: [
      base_ang_vel,
      projected_gravity,
      dof_pos,
      dof_vel,
      actions,
      local_key_body_pos,
      local_key_body_rot,
      anchor_ref_pos,
      anchor_ref_rot,
      next_step_ref_motion,
      history_actor
    ]

    critic_obs: [
      base_lin_vel,
      base_ang_vel,
      projected_gravity,
      dof_pos,
      dof_vel,
      actions,
      local_key_body_pos,
      local_key_body_rot,
      anchor_ref_pos,
      anchor_ref_rot,
      next_step_ref_motion,
      dif_local_rigid_body_pos,
      local_ref_rigid_body_pos,
      dr_base_com,
      dr_link_mass,
      dr_kp,
      dr_kd,
      dr_friction,
      dr_ctrl_delay,
      history_critic
    ]

  obs_auxiliary:
    history_actor: {
      base_ang_vel: 4,
      projected_gravity: 4,
      dof_pos: 4,
      dof_vel: 4,
      actions: 4,
    }

    history_critic: {
      base_ang_vel: 4,
      projected_gravity: 4,
      dof_pos: 4,
      dof_vel: 4,
      actions: 4,
    }

  obs_scales: {
    base_lin_vel: 2.0,
    base_ang_vel: 0.25,
    projected_gravity: 1.0,
    dof_pos: 1.0,
    dof_vel: 0.05,
    actions: 1.0,
    local_key_body_pos: 1.0,
    local_key_body_rot: 1.0,
    anchor_ref_pos: 1.0,
    anchor_ref_rot: 1.0,
    next_step_ref_motion: 1.0,
    dif_local_rigid_body_pos: 1.0,
    local_ref_rigid_body_pos: 1.0,
    ref_motion_phase: 1.0,
    history_actor: 1.0,
    history_critic: 1.0,
    dr_base_com: 1.0,
    dr_link_mass: 1.0,
    dr_kp: 1.0,
    dr_kd: 1.0,
    dr_friction: 1.0,
    dr_ctrl_delay: 1.0,
  }

  noise_scales: {
    base_lin_vel: 0.0,
    base_ang_vel: 0.3,
    projected_gravity: 0.2,
    dof_pos: 0.01,
    dof_vel: 1.0,
    actions: 0.0,
    local_key_body_pos: 0.0,
    local_key_body_rot: 0.0,
    anchor_ref_pos: 0.0,
    anchor_ref_rot: 0.0,
    next_step_ref_motion: 0.0,
    dif_local_rigid_body_pos: 0.0,
    local_ref_rigid_body_pos: 0.0,
    ref_motion_phase: 0.0,
    history_actor: 0.0,
    history_critic: 0.0,
    dr_base_com: 0.0,
    dr_link_mass: 0.0,
    dr_kp: 0.0,
    dr_kd: 0.0,
    dr_friction: 0.0,
    dr_ctrl_delay: 0.0,
  }

  add_noise_currculum: False
  noise_initial_value: 0.05
  noise_value_max: 1.0
  noise_value_min: 0.00001
  soft_dof_pos_curriculum_degree: 0.00001
  soft_dof_pos_curriculum_level_down_threshold: 40
  soft_dof_pos_curriculum_level_up_threshold: 42

  obs_dims:
    - base_lin_vel: 3
    - base_ang_vel: 3
    - projected_gravity: 3
    - dof_pos: ${robot.dof_obs_size}
    - dof_vel: ${robot.dof_obs_size}
    - actions: ${robot.dof_obs_size}
    - local_key_body_pos: ${eval:'3 * ${robot.num_key_bodies}'}
    - local_key_body_rot: ${eval:'6 * ${robot.num_key_bodies}'}
    - anchor_ref_pos: 3
    - anchor_ref_rot: 6
    - next_step_ref_motion: ${eval:'1 + 2 + 3 + 1 + ${robot.dof_obs_size} + (3 * ${robot.num_key_bodies})'}
    - dif_local_rigid_body_pos: ${eval:'3 * ${robot.num_bodies} + 9'}
    - local_ref_rigid_body_pos: ${eval:'3 * ${robot.num_bodies} + 9'}
    - ref_motion_phase: 1
    - dr_base_com: 3
    - dr_link_mass: 22
    - dr_kp: ${robot.dof_obs_size}
    - dr_kd: ${robot.dof_obs_size}
    - dr_friction: 1
    - dr_ctrl_delay: 1

  post_compute_config: {}
  motion_len: -1
